<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>自分のページ</title>
    <link rel="icon" href="icon.png">
</head>

<body>
<input type="checkbox">

<h1>こんにちは</h1>
<h2>これは小さい見出し</h2>

<br>
<hr>

<h3>さらに小さい</h3>

<h1>映画</h1>
<p>映画について書きます。</p>
<p>最近見た映画です。<br>かなり面白かったです。</p>
<hr>

<img src="channels4_profile.jpg">

<strong>重要な文字</strong>

<em>強調した文字</em>

<p>
    <input type="text" id="message">
    <button id="send">Enter</button>
</p>
<div id="chat"></div>


<span>文字の一部分</span>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://wqhcznhalhpsxchkdauz.supabase.co";
const supabaseKey = "sb_publishable_MJMHNXpq8mx3WJ1TH5uuxw_PCMUiamL";

const supabaseClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);

const message = document.getElementById("message");
const chat = document.getElementById("chat");


// この端末専用のIDを作る
let deviceId = localStorage.getItem("device_id");

if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("device_id", deviceId);
}


// 保存されているメッセージを表示
async function loadMessages() {

    const { data, error } = await supabaseClient
        .from("messages")
        .select("*")
        .order("id", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    chat.innerHTML = "";

    data.forEach(function(row) {

        const date = new Date(row.created_at);

        const dateText =
            date.getFullYear() + "/" +
            (date.getMonth() + 1) + "/" +
            date.getDate() + " " +
            String(date.getHours()).padStart(2, "0") + ":" +
            String(date.getMinutes()).padStart(2, "0");

        const isMine =
            localStorage.getItem("admin") === "true" &&
            row.device_id === deviceId;

        chat.innerHTML +=
            "<p>" +
            "<span>" + dateText + "</span> " +
            (isMine ? "★ " : "") +
            row.message +
            "</p>";
    });
}


// メッセージを保存
async function sendMessage() {

    const text = message.value;

    if (text === "") {
        return;
    }


    // 自分の端末として登録
    if (text === "/admin 1234") {

        localStorage.setItem("admin", "true");

        message.value = "";

        loadMessages();

        return;
    }


    // 自分の端末登録を解除
    if (text === "/admin off") {

        localStorage.removeItem("admin");

        message.value = "";

        loadMessages();

        return;
    }


    const { error } = await supabaseClient
        .from("messages")
        .insert({
            message: text,
            device_id: deviceId
        });

    if (error) {
        console.error(error);
        return;
    }

    message.value = "";

    loadMessages();
}


message.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});


document.getElementById("send").addEventListener("click", function() {

    sendMessage();

});


loadMessages();

</script>
</body>
</html>
