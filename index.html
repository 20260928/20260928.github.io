<!DOCTYPE html>
<!-- トップページ: 日記本文 -->
<html>

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=512, initial-scale=1">
    <title>20260928</title>
    <link rel="icon" type="image/png" href="images/site-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <!-- 描画前にコメント欄の予約サイズを復元し、読込中のレイアウト移動を防ぐ -->
    <script>
        (function () {
            const layoutHeight = sessionStorage.getItem(
                "message-layout-reserved-height"
            );
            if (layoutHeight !== null) {
                document.documentElement.classList.add(
                    "message-layout-size-reserved"
                );
                document.documentElement.style.setProperty(
                    "--message-layout-reserved-height",
                    layoutHeight
                );
            }
        })();
    </script>
    <!-- 共通スタイルと日記ページ専用スタイル -->
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <main id="diary-section">
        <!-- 日記本文 -->
        <section id="diary-view" aria-label="選択中の日記">
            <!-- 前後の日記へ移動するボタン。日記が読み込まれるまで非表示。 -->
            <nav class="diary-entry-navigation" aria-label="日記の移動" hidden>
                <button type="button" data-diary-direction="previous">◂</button>
                <button type="button" data-diary-direction="next">▸</button>
                <button id="diary-add" type="button" hidden>追加</button>
            </nav>
            <!-- 日記1件分の表示先 -->
            <div id="diary-list"></div>
        </section>
    </main>

    <!-- 日記の下にコメント一覧と投稿欄を表示する -->
    <section id="message-section" aria-label="コメント">
        <div id="message-layout">
            <div id="message-form">
                <textarea id="message" rows="4" aria-label="コメント"></textarea>
                <div id="message-actions">
                    <div id="message-submit-controls">
                        <button id="send" type="button">送信</button>
                    </div>
                </div>
            </div>
            <div id="chat" aria-label="コメント一覧"></div>
            <div id="chat-older-messages" class="chat-older-messages" aria-label="過去のコメント"></div>
        </div>
    </section>

    <!-- 読込順: Supabaseライブラリ → 接続設定 → 日記 → コメント -->
    <script>
        (function () {
            const readySections = new Set();
            window.markPageSectionReady = function (section) {
                readySections.add(section);
                if (readySections.has("diary") && readySections.has("comments")) {
                    document.body.classList.add("page-sections-ready");
                }
            };
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="diary.js"></script>
    <script src="comment.js"></script>
</body>

</html>
